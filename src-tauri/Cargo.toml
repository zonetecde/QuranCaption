[package]
name = "qurancaption"
version = "1.0.2"
description = "Transform Quranic recitations into stunning captioned videos with professional quality subtitles and translations in 40+ languages."
authors = ["Rayane STASZEWSKI"]
license = "Attribution-NonCommercial 4.0 International (CC BY-NC 4.0)"
repository = "zonetecde/qurancaption"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "qurancaption_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-notification = "2"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
tokio = { version = "1.0", features = ["process", "io-util", "rt-multi-thread", "fs", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
regex = "1.0"
lazy_static = "1.4"
md5 = "0.7"
image = "0.24"
rayon = "1.10"
bytes = "1"
futures-util = "0.3"
sysinfo = "0.30"
tauri-plugin-android-media = { path = "plugins/android-media" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
