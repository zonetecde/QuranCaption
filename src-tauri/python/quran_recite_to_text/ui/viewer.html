<!doctype html>
<html lang="en" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quran Alignment Viewer (Advanced)</title>
		<!-- Modern typography for best eye comfort -->
		<link
			href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
			rel="stylesheet"
		/>
		<style>
			:root {
				/* OLED-friendly Deep Slate Palette */
				--bg-color: #0b0f19;
				--sidebar-bg: #111827;
				--card-bg: rgba(31, 41, 55, 0.4);

				/* Text Colors designed for low eye strain */
				--text-main: #f3f4f6;
				--text-muted: #9ca3af;
				--text-dimmed: rgba(243, 244, 246, 0.25);

				/* Accents */
				--accent: #2dd4bf; /* Soft Teal */
				--accent-glow: rgba(45, 212, 191, 0.4);
				--accent-dim: rgba(45, 212, 191, 0.1);

				--border: rgba(255, 255, 255, 0.08);

				--font-ui: 'Inter', sans-serif;
				--font-quran: 'Amiri', serif;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				background-color: var(--bg-color);
				color: var(--text-main);
				font-family: var(--font-ui);
				height: 100vh;
				overflow: hidden; /* App-like layout */
				display: flex;
			}

			/* --- Global UI Components --- */
			.glass-panel {
				background: var(--card-bg);
				backdrop-filter: blur(24px);
				-webkit-backdrop-filter: blur(24px);
				border: 1px solid var(--border);
			}

			/* --- App Layout --- */
			#appContainer {
				display: flex;
				width: 100%;
				height: 100%;
			}

			/* --- Sidebar Navigation (Right side due to RTL) --- */
			#sidebar {
				width: 340px;
				background: var(--sidebar-bg);
				border-left: 1px solid var(--border);
				display: flex;
				flex-direction: column;
				flex-shrink: 0;
				z-index: 10;
				box-shadow: -4px 0 15px rgba(0, 0, 0, 0.2);
			}

			.sidebar-header {
				padding: 1.5rem 1.5rem 1rem 1.5rem;
				border-bottom: 1px solid var(--border);
				display: flex;
				flex-direction: column;
				gap: 1.25rem;
			}

			.sidebar-header h2 {
				font-size: 1.2rem;
				font-weight: 600;
				color: var(--text-main);
				margin: 0;
				display: flex;
				align-items: center;
				gap: 0.5rem;
			}

			/* Modern Upload Buttons */
			.upload-buttons {
				display: flex;
				gap: 0.75rem;
			}

			.modern-file-btn {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				padding: 0.75rem 1rem;
				background: rgba(255, 255, 255, 0.03);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				color: var(--text-muted);
				font-size: 0.85rem;
				font-weight: 500;
				cursor: pointer;
				transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
				position: relative;
				overflow: hidden;
			}

			.modern-file-btn:hover {
				background: rgba(255, 255, 255, 0.08);
				color: var(--text-main);
				border-color: rgba(255, 255, 255, 0.2);
				transform: translateY(-1px);
			}

			.modern-file-btn.loaded {
				background: var(--accent-dim);
				color: var(--accent);
				border-color: rgba(45, 212, 191, 0.3);
			}

			.modern-file-btn i {
				font-size: 1.1rem;
			}

			.modern-file-btn input[type='file'] {
				display: none;
			}

			.segments-list {
				flex-grow: 1;
				overflow-y: auto;
				padding: 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}

			.segment-nav-item {
				padding: 1rem;
				border-radius: 12px;
				cursor: pointer;
				border: 1px solid transparent;
				transition: all 0.2s;
				background: rgba(255, 255, 255, 0.02);
				text-align: right;
			}

			.segment-nav-item:hover {
				background: rgba(255, 255, 255, 0.05);
			}

			.segment-nav-item.active {
				background: var(--accent-dim);
				border-color: rgba(45, 212, 191, 0.3);
			}

			.segment-nav-item .seg-title {
				font-weight: 600;
				color: var(--text-main);
				font-size: 0.9rem;
				margin-bottom: 0.25rem;
				display: flex;
				justify-content: space-between;
			}

			.segment-nav-item .seg-title span.time {
				color: var(--accent);
				font-variant-numeric: tabular-nums;
			}

			.segment-nav-item .seg-ref {
				font-size: 0.8rem;
				color: var(--text-muted);
			}

			/* --- Player embedded in Sidebar Bottom --- */
			.sidebar-player {
				padding: 1.5rem;
				border-top: 1px solid var(--border);
				background: rgba(0, 0, 0, 0.2);
				display: flex;
				flex-direction: column;
				gap: 1.25rem;
			}

			.timeline-wrapper {
				display: flex;
				align-items: center;
				gap: 1rem;
				font-size: 0.8rem;
				color: var(--text-muted);
				font-variant-numeric: tabular-nums;
				font-family: var(--font-ui);
				direction: ltr; /* Timers look best LTR */
			}

			.progress-bar-container {
				flex-grow: 1;
				height: 6px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 3px;
				cursor: pointer;
				position: relative;
				overflow: hidden;
				transition: height 0.2s;
			}

			.progress-bar-container:hover {
				height: 8px;
			}

			.progress-bar-fill {
				height: 100%;
				background: var(--accent);
				width: 0%;
				border-radius: 3px;
				box-shadow: 0 0 10px var(--accent-glow);
				pointer-events: none;
			}

			.controls-wrapper {
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.play-btn {
				background: var(--accent);
				border: none;
				color: #000;
				width: 52px;
				height: 52px;
				border-radius: 50%;
				font-size: 1.3rem;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
				box-shadow: 0 4px 15px rgba(45, 212, 191, 0.2);
			}

			.play-btn:hover {
				transform: scale(1.08);
				box-shadow: 0 6px 20px rgba(45, 212, 191, 0.4);
				background: #34eed6; /* Lighter teal on hover */
			}

			/* --- Main Content Area (Theater) --- */
			#mainContent {
				flex-grow: 1;
				display: flex;
				flex-direction: column;
				position: relative;
				background: radial-gradient(circle at center, #0f1524 0%, #0b0f19 100%);
			}

			/* Empty State */
			#emptyState {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				color: var(--text-muted);
				opacity: 1;
				transition: opacity 0.5s;
			}

			#emptyState i {
				font-size: 3rem;
				opacity: 0.5;
			}

			#emptyState.hidden {
				opacity: 0;
				pointer-events: none;
			}

			/* Text Display Area */
			#lyricsContainer {
				flex-grow: 1;
				overflow-y: auto;
				padding: 15vh 12% 40vh 12%;
				scroll-behavior: smooth;
			}

			.segment-block {
				margin-bottom: 4rem;
				transition: opacity 0.5s ease;
				opacity: 0.3; /* Default dimmed for theater mode */
			}

			.segment-block.active-segment {
				opacity: 1;
			}

			.segment-block.past-segment {
				opacity: 0.15;
			}

			.text-display {
				font-family: var(--font-quran);
				font-size: 2.75rem;
				line-height: 2.2;
				text-align: right;
				direction: rtl;
			}

			/* Karaoke Words */
			.word {
				display: inline-block;
				cursor: pointer;
				position: relative;
				color: var(--text-dimmed);
				padding: 0 0.15em;
				margin-bottom: 0.5em;
				transition: color 0.1s ease;
			}

			.word.active-glow {
				color: var(--accent); /* Simple highlight color */
			}

			.word.missing-word {
				color: #ef4444;
				border-bottom: 2px dashed rgba(239, 68, 68, 0.4);
				background-image: none;
				-webkit-text-fill-color: #ef4444;
				cursor: not-allowed;
				font-size: 0.8em;
				opacity: 0.7;
			}

			.word:not(.missing-word):hover {
				color: var(--text-main);
				background-image: none;
				-webkit-text-fill-color: var(--text-main);
				text-shadow: none;
			}

			/* Custom scrollbars */
			::-webkit-scrollbar {
				width: 6px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
			::-webkit-scrollbar-thumb {
				background: rgba(255, 255, 255, 0.1);
				border-radius: 3px;
			}
			::-webkit-scrollbar-thumb:hover {
				background: rgba(255, 255, 255, 0.2);
			}

			#lyricsContainer::-webkit-scrollbar {
				width: 10px;
			}
		</style>
	</head>
	<body>
		<!-- App Container -->
		<div id="appContainer">
			<!-- Sidebar Navigation (Right Bar) -->
			<aside id="sidebar">
				<div class="sidebar-header">
					<h2><i class="fas fa-quran"></i> Quran Alignment</h2>

					<!-- Modern Upload Buttons -->
					<div class="upload-buttons">
						<label class="modern-file-btn" id="jsonBtnLabel">
							<i class="fas fa-file-code"></i> <span>JSON</span>
							<input type="file" id="jsonInput" accept=".json" />
						</label>
						<label class="modern-file-btn" id="audioBtnLabel">
							<i class="fas fa-file-audio"></i> <span>Audio</span>
							<input type="file" id="audioInput" accept="audio/*" />
						</label>
					</div>
				</div>

				<!-- Segment Navigation -->
				<div class="segments-list" id="segmentsList">
					<!-- Segment Nav Items Injected Here -->
				</div>

				<!-- Integrated Player (Bottom of Sidebar) -->
				<div class="sidebar-player">
					<div class="timeline-wrapper">
						<span id="currentTime">0:00</span>
						<div class="progress-bar-container" id="progressBarContainer">
							<div class="progress-bar-fill" id="progressBarFill"></div>
						</div>
						<span id="totalTime">0:00</span>
					</div>
					<div class="controls-wrapper">
						<button class="play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
					</div>
				</div>
			</aside>

			<!-- Main Content (Theater Mode) -->
			<main id="mainContent">
				<!-- Hidden Audio -->
				<audio id="audioPlayer"></audio>

				<!-- Empty State -->
				<div id="emptyState">
					<i class="fas fa-folder-open"></i>
					<p>Upload JSON and Audio files to begin playback</p>
				</div>

				<!-- Text Content -->
				<div id="lyricsContainer">
					<!-- Segments and Words injected here -->
				</div>
			</main>
		</div>

		<script>
			/**
			 * Modular Architecture for Advanced Alignment Viewer
			 */

			class DataManager {
				constructor() {
					this.validSegments = [];
					this.allWords = [];
					this.isRelative = false;
				}

				parseJSON(data) {
					let rawSegments = data.segments || data;
					this.validSegments = rawSegments.filter((s) => s.words && s.words.length > 0);

					if (this.validSegments.length === 0) throw new Error('No words found in JSON!');

					// The backend strictly outputs relative timestamps natively for each segment
					this.isRelative = true;

					this.processSegments();
				}

				processSegments() {
					this.allWords = [];
					this.validSegments.forEach((seg, sIdx) => {
						const segTimeFrom = seg.time_from || 0.0;

						seg.words.forEach((w, wIdx) => {
							if (w.start === null || w.end === null) {
								this.allWords.push({
									text: w.word,
									is_missing: w.is_missing || false,
									start: -1,
									end: -1,
									duration: 0,
									segmentIdx: sIdx,
									segmentNum: seg.segment,
									ref: `${seg.ref_from} to ${seg.ref_to}`,
									id: `word_${this.allWords.length}`
								});
								return;
							}

							let absoluteStart = this.isRelative ? w.start + segTimeFrom : w.start;
							let absoluteEnd = this.isRelative ? w.end + segTimeFrom : w.end;

							this.allWords.push({
								text: w.word,
								is_missing: false,
								start: Math.round(absoluteStart * 1000) / 1000,
								end: Math.round(absoluteEnd * 1000) / 1000,
								duration: absoluteEnd - absoluteStart,
								segmentIdx: sIdx,
								segmentNum: seg.segment,
								ref: `${seg.ref_from} to ${seg.ref_to}`,
								id: `word_${this.allWords.length}`
							});
						});
					});
				}
			}

			class UIManager {
				constructor(app) {
					this.app = app;

					// Upload Buttons
					this.jsonInput = document.getElementById('jsonInput');
					this.audioInput = document.getElementById('audioInput');
					this.jsonBtnLabel = document.getElementById('jsonBtnLabel');
					this.audioBtnLabel = document.getElementById('audioBtnLabel');

					// Containers
					this.lyricsContainer = document.getElementById('lyricsContainer');
					this.segmentsList = document.getElementById('segmentsList');
					this.emptyState = document.getElementById('emptyState');

					// Player Controls
					this.playPauseBtn = document.getElementById('playPauseBtn');
					this.currentTimeEl = document.getElementById('currentTime');
					this.totalTimeEl = document.getElementById('totalTime');
					this.progressBarContainer = document.getElementById('progressBarContainer');
					this.progressBarFill = document.getElementById('progressBarFill');

					// Auto-scroll state
					this.autoScrollPaused = false;
					this.scrollTimeout = null;

					this.bindEvents();
				}

				bindEvents() {
					this.jsonInput.addEventListener('change', (e) => this.app.handleJSONUpload(e));
					this.audioInput.addEventListener('change', (e) => this.app.handleAudioUpload(e));

					this.playPauseBtn.addEventListener('click', () => this.app.audioEngine.togglePlay());

					this.progressBarContainer.addEventListener('click', (e) => {
						const rect = this.progressBarContainer.getBoundingClientRect();
						const percentage = (e.clientX - rect.left) / rect.width;
						this.app.audioEngine.seek(percentage);
					});

					// Detect manual scrolling to pause auto-scroll
					const pauseScroll = () => {
						this.autoScrollPaused = true;
						clearTimeout(this.scrollTimeout);
						// Resume auto-scroll after 3 seconds of inactivity
						this.scrollTimeout = setTimeout(() => {
							this.autoScrollPaused = false;
						}, 3000);
					};

					this.lyricsContainer.addEventListener('wheel', pauseScroll, { passive: true });
					this.lyricsContainer.addEventListener('touchstart', pauseScroll, { passive: true });
					this.lyricsContainer.addEventListener('mousedown', pauseScroll, { passive: true });
				}

				updateUploadState(type, loaded) {
					if (type === 'json') {
						if (loaded) this.jsonBtnLabel.classList.add('loaded');
					} else if (type === 'audio') {
						if (loaded) this.audioBtnLabel.classList.add('loaded');
					}
				}

				renderContent(dataManager) {
					this.lyricsContainer.innerHTML = '';
					this.segmentsList.innerHTML = '';
					this.emptyState.classList.add('hidden');

					dataManager.validSegments.forEach((seg, sIdx) => {
						// Render Sidebar Item
						const navItem = document.createElement('div');
						navItem.className = 'segment-nav-item';
						navItem.id = `nav_seg_${sIdx}`;
						navItem.innerHTML = `
                        <div class="seg-title">
                            <span>Segment ${seg.segment}</span>
                            <span class="time">${this.formatTime(seg.time_from)}</span>
                        </div>
                        <div class="seg-ref">${seg.ref_from} &rarr; ${seg.ref_to}</div>
                    `;
						navItem.addEventListener('click', () => this.app.audioEngine.seekToTime(seg.time_from));
						this.segmentsList.appendChild(navItem);

						// Render Theater Block
						const block = document.createElement('div');
						block.className = 'segment-block';
						block.id = `block_seg_${sIdx}`;

						const textDiv = document.createElement('div');
						textDiv.className = 'text-display';

						// Get words for this segment
						const segWords = dataManager.allWords.filter((w) => w.segmentIdx === sIdx);

						segWords.forEach((w) => {
							const span = document.createElement('span');
							span.className = 'word';
							span.id = w.id;
							span.textContent = w.text;

							if (w.is_missing) {
								span.classList.add('missing-word');
							} else {
								span.addEventListener('click', () => this.app.audioEngine.seekToTime(w.start));
							}
							textDiv.appendChild(span);
						});

						block.appendChild(textDiv);
						this.lyricsContainer.appendChild(block);
					});
				}

				updatePlaybackUI(isPlaying) {
					this.playPauseBtn.innerHTML = isPlaying
						? '<i class="fas fa-pause"></i>'
						: '<i class="fas fa-play"></i>';
				}

				updateProgress(currentTime, totalTime) {
					this.currentTimeEl.textContent = this.formatTime(currentTime);
					if (totalTime) {
						this.progressBarFill.style.width = `${(currentTime / totalTime) * 100}%`;
					}
				}

				updateTheaterMode(activeSegmentIdx, activeWordSpan) {
					// Update Sidebar Highlighting
					document
						.querySelectorAll('.segment-nav-item')
						.forEach((el) => el.classList.remove('active'));
					if (activeSegmentIdx !== null) {
						const activeNav = document.getElementById(`nav_seg_${activeSegmentIdx}`);
						if (activeNav) {
							activeNav.classList.add('active');
							// Auto-scroll sidebar if out of view (smooth tracking)
							activeNav.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
						}
					}

					// Update Theater Blocks
					document.querySelectorAll('.segment-block').forEach((el, idx) => {
						el.classList.remove('active-segment', 'past-segment');
						if (activeSegmentIdx !== null) {
							if (idx === activeSegmentIdx) el.classList.add('active-segment');
							else if (idx < activeSegmentIdx) el.classList.add('past-segment');
						}
					});

					// Auto-scroll Main Content (Only if user hasn't scrolled manually recently)
					if (activeWordSpan && this.app.audioEngine.isPlaying && !this.autoScrollPaused) {
						const containerRect = this.lyricsContainer.getBoundingClientRect();
						const wordRect = activeWordSpan.getBoundingClientRect();

						const relativeY = wordRect.top - containerRect.top;
						const targetY = containerRect.height / 3; // Focus point slightly above center

						if (Math.abs(relativeY - targetY) > 80) {
							// Slightly larger deadzone
							this.lyricsContainer.scrollBy({
								top: relativeY - targetY,
								behavior: 'smooth'
							});
						}
					}
				}

				formatTime(seconds) {
					if (isNaN(seconds) || seconds === null) return '0:00';
					const m = Math.floor(seconds / 60);
					const s = Math.floor(seconds % 60);
					return `${m}:${s < 10 ? '0' : ''}${s}`;
				}
			}

			class AudioEngine {
				constructor(app) {
					this.app = app;
					this.player = document.getElementById('audioPlayer');
					this.isPlaying = false;
					this.animationFrameId = null;

					this.bindEvents();
				}

				bindEvents() {
					this.player.addEventListener('play', () => {
						this.isPlaying = true;
						this.app.ui.updatePlaybackUI(true);
						this.syncLoop();
					});

					this.player.addEventListener('pause', () => {
						this.isPlaying = false;
						this.app.ui.updatePlaybackUI(false);
						if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
						this.app.syncUI(); // Final frame
					});

					this.player.addEventListener('loadedmetadata', () => {
						this.app.ui.totalTimeEl.textContent = this.app.ui.formatTime(this.player.duration);
					});
				}

				loadURL(url) {
					this.player.src = url;
				}

				togglePlay() {
					if (!this.player.src) return;
					if (this.player.paused) this.player.play();
					else this.player.pause();
				}

				seek(percentage) {
					if (!this.player.src) return;
					this.player.currentTime = percentage * this.player.duration;
					if (!this.isPlaying) this.app.syncUI();
				}

				seekToTime(time) {
					if (!this.player.src) return;
					this.player.currentTime = time;
					if (!this.isPlaying) {
						this.app.syncUI();
					}
				}

				syncLoop() {
					this.app.syncUI();
					if (this.isPlaying) {
						this.animationFrameId = requestAnimationFrame(() => this.syncLoop());
					}
				}
			}

			class App {
				constructor() {
					this.data = new DataManager();
					this.ui = new UIManager(this);
					this.audioEngine = new AudioEngine(this);
					this.jsonLoaded = false;
					this.audioLoaded = false;
				}

				handleJSONUpload(e) {
					const file = e.target.files[0];
					if (!file) return;
					const reader = new FileReader();
					reader.onload = (event) => {
						try {
							const json = JSON.parse(event.target.result);
							this.data.parseJSON(json);
							this.jsonLoaded = true;
							this.ui.updateUploadState('json', true);
							this.checkReady();
						} catch (err) {
							alert('JSON Error: ' + err.message);
						}
					};
					reader.readAsText(file);
				}

				handleAudioUpload(e) {
					const file = e.target.files[0];
					if (!file) return;
					this.audioEngine.loadURL(URL.createObjectURL(file));
					this.audioLoaded = true;
					this.ui.updateUploadState('audio', true);
					this.checkReady();
				}

				checkReady() {
					if (this.jsonLoaded) {
						this.ui.renderContent(this.data);
					}
				}

				syncUI() {
					if (!this.jsonLoaded) return;
					const t = this.audioEngine.player.currentTime;
					this.ui.updateProgress(t, this.audioEngine.player.duration);

					let activeSegmentIdx = null;
					let activeWordSpan = null;

					// Sync Words
					for (let i = 0; i < this.data.allWords.length; i++) {
						const w = this.data.allWords[i];

						const span = document.getElementById(w.id);
						if (!span) continue;

						if (t >= w.start && t <= w.end) {
							// Word is Active
							if (!span.classList.contains('active-glow')) {
								span.classList.add('active-glow');
							}
							activeWordSpan = span;
							activeSegmentIdx = w.segmentIdx;
						} else {
							// Word Past or Future (De-highlighted)
							span.classList.remove('active-glow');
						}
					}

					// If not exactly on a word, find the active segment block by time
					if (activeSegmentIdx === null) {
						const activeSeg = this.data.validSegments.findIndex(
							(s) => s.time_from <= t && s.time_to >= t
						);
						if (activeSeg !== -1) activeSegmentIdx = activeSeg;
					}

					this.ui.updateTheaterMode(activeSegmentIdx, activeWordSpan);
				}
			}

			// Initialize App
			const app = new App();
		</script>
	</body>
</html>
